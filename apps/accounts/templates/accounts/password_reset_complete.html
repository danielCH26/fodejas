{% extends "base.html" %}

{% block title %}Contraseña Restablecida - FODEJAS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                </div>

                <h4 class="mb-3">Contraseña restablecida</h4>

                <p class="text-muted">
                    Su contraseña ha sido cambiada correctamente.
                    Ahora puede iniciar sesión con su nueva contraseña.
                </p>

                <hr class="my-4">

                <a href="{% url 'accounts:login' %}" class="btn btn-fodejas btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
