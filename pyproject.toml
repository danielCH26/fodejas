[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fodejas"
version = "0.1.0"
description = "FODEJAS - Fondo para el Desarrollo Educativo de los Jóvenes del Archipiélago"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2",
    "djangorestframework>=3.14",
    "django-filter>=24.0",
    "djangorestframework-simplejwt[crypto]>=5.3",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.3",
    "django-celery-beat>=2.5",
    "python-dateutil>=2.8",  # relativedelta for working-day deadline math (CHG-802)
    "boto3>=1.28",
    "django-storages>=1.14",
    "weasyprint>=60.0",
    "django-crispy-forms>=1.14",
    "crispy-bootstrap5>=0.7",
    "django-htmx>=1.17",
    "django-environ>=0.11",
    "python-json-logger>=2.0",
    "sentry-sdk>=2.0",
    "prometheus-client>=0.20",
    "django-prometheus>=2.3",
    "gunicorn>=21.2",  # CHG-803 — production WSGI server (replaces runserver).
    "django-cors-headers>=4.3",  # CHG-803 — CORS_ALLOWED_ORIGINS for the official domains.
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.1.0",
    "isort>=5.12",
    "pytest>=7.4",
    "pytest-django>=4.7",
    "factory-boy>=3.3",
    "pre-commit>=3.5",
    "detect-secrets>=1.4",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | \.tox
    | build
    | dist
    | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Documented lint debt (MVP acceptance, docs/mvp-acceptance.md §2).
# E402: modules that configure Django before importing app modules.
"apps/accounts/urls.py" = ["E402"]
"apps/applications/views.py" = ["E402"]
"apps/audit/urls.py" = ["E402"]
"apps/audit/views.py" = ["E402"]
"debug_models.py" = ["E402"]
"qa_claims_test.py" = ["E402"]
"qa_test.py" = ["E402"]
# C901: complex legacy/admin handlers pending refactor.
"apps/accounts/management/commands/sync_roles.py" = ["C901"]
"apps/accounts/views/admin_views.py" = ["C901"]
"apps/audit/tests/test_views_permissions.py" = ["C901"]
"apps/convocatories/domain/validators.py" = ["C901"]
"apps/core/management/commands/migrate_legacy_data.py" = ["C901"]
"apps/treasury/services.py" = ["C901"]
# B017: tests asserting a generic failure signal on purpose.
"apps/accounts/tests/test_models.py" = ["B017"]
"apps/applications/tests/test_views.py" = ["B017"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["apps"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*"]
