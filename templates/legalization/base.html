{% extends "base.html" %}

{% block title %}{% block legal_title %}Legalización{% endblock %} - FODEJAS{% endblock %}

{% block content %}
<div class="row">
    <!-- Sidebar -->
    <div class="col-md-3 mb-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-file-earmark-text me-2"></i>Legalización
            </div>
            <div class="list-group list-group-flush">
                <a href="{% url 'legalization:list' %}"
                   class="list-group-item list-group-item-action
                          {% if request.resolver_match.url_name == 'list' %}active{% endif %}">
                    <i class="bi bi-list-ul me-2"></i>Procesos
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9">
        {% block legal_content %}{% endblock %}
    </div>
</div>
{% endblock %}
