{# Authorize error partial — replaces #authorize-errors after a failed authorize POST. #}
{% load i18n %}

<div id="authorize-errors" class="mt-3">
    <div class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle me-1"></i>
        {{ error }}
    </div>
    <button
        hx-get="{% url 'treasury:authorize' authorization.pk %}"
        hx-target="#authorize-panel"
        hx-swap="innerHTML"
        class="btn btn-success btn-sm">
        <i class="bi bi-pen"></i> {% trans "Reintentar" %}
    </button>
</div>
<div id="authorize-panel"></div>
